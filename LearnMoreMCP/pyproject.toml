[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learnmore-music-mcp"
version = "0.1.0"
description = "LearnMore 日文歌曲秒數校正 MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1"]

[project.scripts]
learnmore-music-mcp = "learnmore_music_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
