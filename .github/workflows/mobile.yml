name: iOS 第一版檢查
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: 選擇 Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm test
      - name: 安裝 WebKit 測試瀏覽器
        run: npx playwright install webkit
      - name: 驗證登入與收藏畫面
        run: npm run test:ui
      - name: 保留失敗的畫面測試紀錄
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ui-test-results
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run ios:sync
      - name: 編譯 iOS 模擬器版本
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
