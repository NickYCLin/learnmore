name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: .NET 8 測試
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v7

      - name: 安裝 .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 安裝 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LearnMore/wwwroot/js/package-lock.json

      - name: 還原日文處理套件
        run: npm ci --prefix LearnMore/wwwroot/js

      - name: 還原套件
        run: dotnet restore LearnMore.sln

      - name: 執行測試
        run: dotnet test LearnMore.sln --configuration Release --no-restore

      - name: 驗證發布內容
        shell: pwsh
        run: |
          Copy-Item LearnMore/appsettings.Local.example.json LearnMore/appsettings.Local.json
          dotnet publish LearnMore/LearnMore.csproj --configuration Release --no-restore --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path artifacts/publish/appsettings.Local.json) { throw "發布成品不應包含本機設定" }
          if (!(Test-Path artifacts/publish/wwwroot/js/node_modules/kuromoji/dict/tid_pos.dat.gz)) { throw "發布成品缺少 Kuromoji 字典" }

  api-test:
    name: API 與維運腳本檢查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下載原始碼
        uses: actions/checkout@v7

      - name: 安裝 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝測試套件
        run: python -m pip install -r LearnMoreAPI/requirements-test.txt

      - name: 執行 API 測試
        working-directory: LearnMoreAPI
        run: python -m pytest -q

      - name: 檢查腳本語法
        run: |
          python -m compileall -q scripts LearnMoreAPI/learnmore_api
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.cjs; do node --check "$script"; done
