name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: .NET 8 測試
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v7

      - name: 安裝 .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 安裝 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LearnMore/wwwroot/js/package-lock.json

      - name: 還原日文處理套件
        run: npm ci --prefix LearnMore/wwwroot/js

      - name: 驗證 Windows PowerShell 部署檢查
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Windows PowerShell 5.1 is required for this regression test." }
          node scripts/verify_learnmore_mobile_backend.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 還原套件
        run: dotnet restore LearnMore.sln

      - name: 執行測試
        run: dotnet test LearnMore.sln --configuration Release --no-restore

      - name: 驗證發布內容
        shell: pwsh
        run: |
          Copy-Item LearnMore/appsettings.Local.example.json LearnMore/appsettings.Local.json
          dotnet publish LearnMore/LearnMore.csproj --configuration Release --no-restore --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path artifacts/publish/appsettings.Local.json) { throw "發布成品不應包含本機設定" }
          if (!(Test-Path artifacts/publish/wwwroot/js/node_modules/kuromoji/dict/tid_pos.dat.gz)) { throw "發布成品缺少 Kuromoji 字典" }

      - name: 記錄部署版本
        shell: pwsh
        run: git rev-parse HEAD | Set-Content artifacts/publish/commit.txt

      - name: 保留網站部署包
        uses: actions/upload-artifact@v7
        with:
          name: LearnMore-Backend
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

      - name: 保留已驗證的部署檢查腳本
        uses: actions/upload-artifact@v7
        with:
          name: LearnMore-Deployment-Tools
          path: scripts/verify_learnmore_mobile_backend.ps1
          if-no-files-found: error
          retention-days: 14

  sql-audit:
    name: 隔離 SQL Server 並行驗證
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: 啟動僅供合成資料的 SQL Server
        shell: bash
        run: |
          password="$(openssl rand -base64 24)Aa1!"
          echo "::add-mask::$password"
          docker run -d --name learnmore-sql-audit -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$password" -p 127.0.0.1:15439:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "LEARNMORE_SQL_AUDIT=Server=127.0.0.1,15439;Database=master;User Id=sa;Password=$password;TrustServerCertificate=true" >> "$GITHUB_ENV"
          ready=false
          for attempt in {1..60}; do
            if docker exec learnmore-sql-audit bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: 執行真實 SQL 與鎖定交錯測試
        run: dotnet test LearnMore.Tests/LearnMore.Tests.csproj --configuration Release --filter FullyQualifiedName~SqlAccountIntegrationTests --logger "trx;LogFileName=sql-audit.trx"
      - name: 保留 SQL 測試結果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LearnMore-SQL-Audit
          path: LearnMore.Tests/TestResults/sql-audit.trx
          if-no-files-found: error
      - name: 移除隔離資料庫容器
        if: always()
        run: docker rm -f learnmore-sql-audit

  api-test:
    name: API 與維運腳本檢查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下載原始碼
        uses: actions/checkout@v7

      - name: 安裝 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝測試套件
        run: python -m pip install -r LearnMoreAPI/requirements-test.txt

      - name: 執行 API 測試
        working-directory: LearnMoreAPI
        run: python -m pytest -q

      - name: 檢查腳本語法
        run: |
          python -m compileall -q scripts LearnMoreAPI/learnmore_api
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.cjs; do node --check "$script"; done
