name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main, codex/ios-app-store]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify submission SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Playback core tests
        run: swift test --package-path ios/PlaybackCore
      - name: Release build
        timeout-minutes: 10
        run: >-
          xcodebuild -quiet -project ios/LearnMore.xcodeproj -scheme LearnMore
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LearnMoreBuild" -jobs 2
          CODE_SIGNING_ALLOWED=NO build
      - name: Select UI test simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS-26" in runtime for x in devices if x["name"].startswith("iPhone")))')"
          echo "LEARNMORE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build UI tests
        timeout-minutes: 10
        run: |
          xcodebuild -quiet -project ios/LearnMore.xcodeproj -scheme LearnMore \
            -destination "platform=iOS Simulator,id=$LEARNMORE_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/LearnMoreBuild" \
            -jobs 2 CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Boot UI test simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$LEARNMORE_SIMULATOR_ID" -b
      - name: UI tests
        timeout-minutes: 15
        run: |
          xcodebuild -quiet -project ios/LearnMore.xcodeproj -scheme LearnMore \
            -destination "platform=iOS Simulator,id=$LEARNMORE_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/LearnMoreBuild" \
            -resultBundlePath "$RUNNER_TEMP/LearnMoreUITests.xcresult" \
            -parallel-testing-enabled NO -jobs 2 CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LearnMore-UI-QA
          path: ${{ runner.temp }}/LearnMoreUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
